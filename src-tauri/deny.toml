# cargo-deny configuration: licenses + advisories.
[graph]
all-features = false
# Supported platforms only (Linux is not a target), which keeps
# Linux-only GTK/webkit2gtk crates out of the audit.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  # `paste` is unmaintained (no vulnerability): a compile-time proc-macro pulled in by
  # tauri 2.12 and specta rc.26 themselves. Revisit when they migrate (e.g. to `pastey`).
  { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro used by tauri and specta" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

# Burbuja itself is not published (`publish = false`), so it needs no license entry.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
